<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kaba Adime - Sri Lankan Game</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: url('https://i.ibb.co/qYWhy6XH/sinhala-tamil-new-year-design-600nw-2590903529.webp') no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.85);
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    h1 { color: #222; }
    .scoreboard { margin: 20px 0; }
    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #008000;
      color: white;
      border: none;
      border-radius: 8px;
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.95); }
    .result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
    .rope-animation {
      font-size: 50px;
      margin: 20px 0;
      animation: pull 0.6s ease-out;
    }
    @keyframes pull {
      0% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>කබ අදිමේ (Kaba Adime)</h1>
  <p>Player vs Player - Online Multiplayer!</p>

  <div class="scoreboard">
    <p>👤 Your Score: <span id="playerScore">0</span></p>
    <p>🧍 Opponent Score: <span id="opponentScore">0</span></p>
  </div>

  <div id="rope" class="rope-animation">🤜🏽-----💢-----🤛🏽</div>

  <button id="pullBtn">Pull Rope!</button>

  <div class="result" id="resultText">Join a room to start!</div>
</div>

<!-- Sounds -->
<audio id="pullSound" src="https://cdn.pixabay.com/download/audio/2024/04/02/audio_f9ea5aad6a.mp3?filename=rope-tighten-knot-14-199797.mp3"></audio>
<audio id="winSound" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_2722574464.mp3?filename=badge-coin-win-14675.mp3"></audio>
<audio id="tieSound" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_2722574464.mp3?filename=badge-coin-win-14675.mp3"></audio>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
